[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-capacity-lab"
version = "0.1.0"
description = "Laboratorio AIOps de Capacity Planning VMware com PCA, K-Means e t-SNE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.14,<2.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<0.15",
    "openpyxl>=3.1,<4.0",
    "ipykernel>=6.29,<8.0",
]

[tool.setuptools.packages.find]
where = ["src"]